services:
  bundler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  
    environment:
      - NODE_ENV=production
    networks:
      - life_ai_network

  nginx-proxy:
    image: jwilder/nginx-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - life_ai_network

networks:
  life_ai_network:
    name: life_ai_network
    driver: bridge
